name: Release

# Push a tag like v0.1.0 to build every ROM and publish a GitHub Release with
# the .z64 files attached:  git tag v0.1.0 && git push origin v0.1.0
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      - uses: ./.github/actions/build
        with:
          version: ${{ github.ref_name }}

      - name: Name ROMs after the release
        run: |
          rm -f dist/*-test.z64   # self-playing test builds are for CI and win-test.ps1, not releases
          for f in dist/*.z64; do
            mv "$f" "dist/$(basename "$f" .z64)-${GITHUB_REF_NAME}.z64"
          done

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "$GITHUB_REF_NAME" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" dist/*.z64 \
            --title "J64 $GITHUB_REF_NAME" --generate-notes $prerelease
