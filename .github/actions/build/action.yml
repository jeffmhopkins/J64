name: Build J64
description: Build the dev image (cached), run host tests, and build every ROM into dist/.
inputs:
  version:
    description: Version string baked into the ROMs (defaults to git describe).
    required: false
    default: ""
runs:
  using: composite
  steps:
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Build dev image
      uses: docker/build-push-action@v7
      with:
        context: .
        file: docker/Dockerfile
        tags: j64-dev:ci
        load: true
        cache-from: type=gha,scope=j64-dev
        cache-to: type=gha,scope=j64-dev,mode=max

    - name: Host tests
      shell: bash
      env:
        J64_IMAGE: j64-dev:ci
      run: tools/dev.sh make test

    - name: Build ROMs
      shell: bash
      env:
        J64_IMAGE: j64-dev:ci
        J64_VERSION: ${{ inputs.version }}
      run: tools/dev.sh make all
